<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Ranger Driver</title>

  <!-- Link to the homepage CSS (cache-bust query to force reload when replacing) -->
  <link rel="stylesheet" href="homepage.css?v=20260204">

  <!-- Optional: preconnect to google fonts (speeds font load) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <noscript style="color:#fff; padding:12px; background:#111; text-align:center;">
    Please enable JavaScript for the best experience.
  </noscript>

  <!-- VIEWPORT: centers the design canvas and allows proportional scaling -->
  <div class="viewport">
    <!-- DESIGN CANVAS (Penpot frame sized 360 x 640) -->
    <div id="app" class="canvas" role="application" aria-label="Ranger Driver app">

      <!-- BRAND (right-top as in design) -->
      <div class="brand" aria-hidden="true">
        <span class="brand-name">Ranger</span>
        <span class="brand-plus">+</span>
      </div>

      <!-- HERO (exact positions derived from Penpot) -->
      <div class="hero" aria-hidden="true">
        <div class="hero-text" aria-hidden="true">
          <span>#</span>
          <span>NARIK</span>
          <span>TERUS</span>
          <span>KETUA</span>
        </div>
      </div>

      <!-- LOGIN CARD (positioned exactly like design) -->
      <div class="login-card" role="region" aria-label="Login card">
        <div class="helper-text">Masuk disini</div>

        <form id="driverForm" class="driver-form" novalidate autocomplete="off">
          <div class="label-row">
            <span class="label">ID Driver</span>
            <button type="button" class="help-btn" aria-label="Bantuan ID Driver" title="Contoh format: #A1B2C3">?</button>
          </div>

          <input
            type="text"
            id="driverId"
            name="driverId"
            class="input"
            placeholder="#XXXXXX"
            inputmode="text"
            maxlength="7"
            aria-describedby="hint"
            required
          />

          <div id="hint" class="input-hint">Contoh format ID Driver</div>

          <button type="submit" class="btn-primary" aria-label="Gas!">Gas!</button>
        </form>

        <div class="message" aria-hidden="false">
          <span>Udah masukin ID tapi gabisa DI-gas?</span>
          <a class="help-link" href="#" role="link">baca dulu</a>
        </div>
      </div>

    </div>
  </div>

  <!-- Hook to your script (keeps behavior separate) -->
  <script src="script.js"></script>
</body>
</html>
