<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Ranger Driver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>

  <!-- APP ROOT -->
  <div id="app" class="app">

    <!-- HEADER / BRAND -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-name">Ranger</span>
        <span class="brand-plus">+</span>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">

      <!-- HERO / DECORATIVE TEXT -->
      <section class="hero">
        <h1 class="hero-text">
          <span>#</span>
          <span>NARIK</span>
          <span>TERUS</span>
          <span>KETUA</span>
        </h1>
      </section>

      <!-- LOGIN CARD -->
      <section class="login-card">

        <!-- HELPER TEXT -->
        <p class="helper-text">Masuk disini</p>

        <!-- FORM -->
        <form id="driverForm" class="driver-form" novalidate>

          <!-- LABEL + HELP -->
          <div class="label-row">
            <label for="driverId">ID Driver</label>
            <button 
              type="button" 
              class="help-btn" 
              aria-label="Bantuan ID Driver"
            >?</button>
          </div>

          <!-- INPUT -->
<input
  type="text"
  id="driverId"
  name="driverId"
  class="input"
  placeholder="#XXXXXX"
  autocomplete="off"
  required
/>
<small class="input-hint">Contoh format ID Driver</small>

          <!-- SUBMIT -->
          <button type="submit" class="btn-primary">
            Gas!
          </button>

        </form>

        <!-- ERROR / INFO MESSAGE -->
        <div id="messageBox" class="message hidden">
          <p>Udah masukin ID tapi gabisa DI-gas?</p>
          <a href="#" class="help-link">baca dulu</a>
        </div>

      </section>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
